<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный кабинет — Личный кабинет студента</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="app-header__inner">
      <a class="app-header__logo" href="login.html">Личный кабинет студента</a>
      <nav class="app-nav" aria-label="Основная навигация">
        <a href="login.html">Авторизация</a>
        <a href="profile.html" aria-current="page">Личный кабинет</a>
      </nav>
    </div>
  </header>

  <main class="app-main">
    <div class="page-heading">
      <h1>Личный кабинет</h1>
      <p>Основная информация о студенте</p>
    </div>
    <section class="profile-card" aria-label="Карточка профиля студента">
      <div class="profile-avatar">
        <div class="profile-avatar__placeholder" aria-hidden="true">ИИ</div>
        <p>Студент</p>
      </div>
      <div class="profile-fields">
        <div class="profile-field">
          <span class="profile-field__label">ФИО</span>
          <span class="profile-field__value">Иванов Иван Иванович</span>
        </div>
        <div class="profile-field">
          <span class="profile-field__label">Группа</span>
          <span class="profile-field__value">ИСТ-201</span>
        </div>
        <div class="profile-field">
          <span class="profile-field__label">Курс</span>
          <span class="profile-field__value">2</span>
        </div>
        <div class="profile-field">
          <span class="profile-field__label">Email</span>
          <a class="profile-field__value" href="mailto:ivanov@example.edu">ivanov@example.edu</a>
        </div>
        <div class="profile-field">
          <span class="profile-field__label">Телефон</span>
          <a class="profile-field__value" href="tel:+79000000000">+7 900 000-00-00</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <p>&copy; 2026 Личный кабинет студента</p>
  </footer>
</body>
</html>
